<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Box Model</title>
    <style>
        :root {
            color-scheme: light;
            --page: #f5f1fb;
            --text: #4a4560;
            --margin: #ffe0d6;
            --border: #ffc4d6;
            --padding: #c9f0dd;
            --content: #d9d2f7;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 16px;
        }

        h1 {
            margin: 0 0 28px;
            text-align: center;
            font-weight: 600;
        }

        .layer {
            display: flex;
            flex-direction: column;
            text-align: center;
            padding: 0 clamp(14px, 4vw, 40px) clamp(14px, 4vw, 40px);
            border-radius: 20px;
        }

        .layer>p {
            margin: 0;
            padding: clamp(8px, 2vw, 16px) 0;
            font-weight: 600;
        }

        .layer>.layer,
        .layer>.content {
            flex: 1;
        }

        .outer {
            width: min(700px, 100%);
            min-height: 500px;
            background: var(--margin);
        }

        .border {
            background: var(--border);
            border: 4px solid #f59bb8;
        }

        .padding {
            background: var(--padding);
        }

        .content {
            background: var(--content);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content h2 {
            margin: 0;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <h1>Box Plotting</h1>
    <div class="layer outer">
        <p>Margin</p>
        <div class="layer border">
            <p>Border</p>
            <div class="layer padding">
                <p>Padding</p>
                <div class="content">
                    <h2>Content</h2>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
