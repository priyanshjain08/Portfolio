
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 1200px;
            min-height: 100vh;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(30px, 6vw, 80px);
            padding: 40px 0;
        }

        /* Profile Card */
        .profile-card {
            width: 320px;
            max-width: 100%;
            flex-shrink: 0;
            background-color: rgb(232, 237, 240);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .cover {
            height: 150px;
            background-color: rgb(2, 2, 83);
            position: relative;
        }

        /* Profile Picture */
        .profile-picture {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 70px;
            transform: translateX(-50%);
            border: 4px solid white;
            outline: 2px solid rgb(190, 200, 207);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .profile-picture svg {
            width: 62px;
            height: 62px;
        }

        /* Profile Information */
        .profile-info {
            text-align: center;
            padding: 40px 20px 25px;
        }

        .profile-info h2 {
            font-size: clamp(19px, 3vw, 24px);
            margin-bottom: 10px;
            overflow-wrap: break-word;
        }

        .profile-info p {
            color: #666;
            margin: 6px 0;
            font-size: 15px;
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 22px;
        }

        .social-icons a {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 24px;
            text-decoration: none;
            background: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .social-icons a:hover {
            transform: translateY(-6px) scale(1.15);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
        }

        .fa-facebook {
            color: #1877F2;
        }

        .fa-instagram {
            background: linear-gradient(
                45deg,
                #feda75,
                #fa7e1e,
                #d62976,
                #962fbf,
                #4f5bd5
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .fa-github {
            color: #6e40c9;
        }

        .fa-behance {
            color: #1769ff;
        }

        /* Buttons */
        .profile-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .profile-buttons button {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            background: rgb(2, 2, 83);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .profile-buttons button:hover {
            background: rgb(5, 5, 20);
            transform: translateY(-2px);
        }

        /* Stats */
        .stats {
            border-top: 1px solid #ddd;
            padding: 18px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stats-div {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 7px;
            color: #555;
            font-size: 14px;
        }

        .stats i {
            font-size: 17px;
        }

        /* Hero Section */
        .box {
            display: flex;
            align-items: stretch;
            flex: 1;
            min-width: 0;
            min-height: 400px;
            margin: 0;
        }

        .left-bar {
            width: 12px;
            flex-shrink: 0;
            margin-right: 25px;
            margin-top: 15px;
            background: rgb(2, 2, 83);
            border-radius: 20px;
        }

        .big-text {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .big-text h1 {
            font-size: clamp(45px, 8vw, 110px);
            font-family: Cambria, Cochin, Georgia, Times,
                'Times New Roman', serif;
            line-height: 1;
            font-weight: 800;
            color: rgb(2, 2, 83);
            overflow-wrap: break-word;
        }

        /* Tablet */
        @media (max-width: 900px) {
            .container {
                width: 92%;
                gap: 30px;
            }

            .big-text h1 {
                font-size: clamp(42px, 7vw, 75px);
            }

            .left-bar {
                margin-right: 18px;
            }

            .profile-card {
                width: 300px;
            }
        }

        /* Mobile */
        @media (max-width: 650px) {
            .container {
                width: 90%;
                min-height: 100vh;
                flex-direction: column;
                justify-content: center;
                gap: 35px;
                padding: 35px 0;
            }

            .box {
                width: 100%;
                min-height: auto;
                justify-content: center;
                margin: 0;
            }

            .left-bar {
                width: 7px;
                margin-right: 15px;
                margin-top: 5px;
            }

            .big-text {
                justify-content: center;
            }

            .big-text h1 {
                font-size: clamp(42px, 11vw, 65px);
                text-align: left;
            }

            .profile-card {
                width: min(100%, 350px);
            }

            .profile-info {
                padding: 40px 15px 22px;
            }
        }

        /* Small Mobile */
        @media (max-width: 380px) {
            .container {
                width: 94%;
                gap: 25px;
            }

            .big-text h1 {
                font-size: 42px;
            }

            .left-bar {
                margin-right: 10px;
            }

            .profile-card {
                width: 100%;
            }

            .social-icons {
                gap: 12px;
            }

            .social-icons a {
                width: 42px;
                height: 42px;
                font-size: 21px;
            }

            .profile-buttons button {
                padding: 9px 20px;
            }

            .stats {
                padding: 15px 5px;
            }

            .stats-div {
                gap: 5px;
                font-size: 12px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- Hero Section -->
        <div class="box">

            <div class="left-bar"></div>

            <div class="big-text">
                <h1>
                    Profile Card <br>
                    Ui/UX <br>
                    Design
                </h1>
            </div>

        </div>

        <!-- Profile Card -->
        <div class="profile-card">

            <div class="cover">

                <div class="profile-picture">

                    <!-- Developer Icon -->
                    <svg viewBox="0 0 64 64"
                        xmlns="http://www.w3.org/2000/svg"
                        role="img"
                        aria-label="Developer">

                        <rect x="9" y="12" width="46" height="32"
                            rx="4" fill="#020253"/>

                        <rect x="13" y="16" width="38" height="24"
                            rx="2" fill="#1d3fbf"/>

                        <path d="M26 22 L19 28 L26 34"
                            fill="none" stroke="#fff"
                            stroke-width="3"
                            stroke-linecap="round"
                            stroke-linejoin="round"/>

                        <path d="M38 22 L45 28 L38 34"
                            fill="none" stroke="#fff"
                            stroke-width="3"
                            stroke-linecap="round"
                            stroke-linejoin="round"/>

                        <path d="M35 20 L29 36"
                            fill="none" stroke="#feda75"
                            stroke-width="3"
                            stroke-linecap="round"/>

                        <path d="M4 48 H60 L56 54 H8 Z"
                            fill="#8a94a6"/>

                    </svg>

                </div>

            </div>

            <!-- Profile Information -->
            <div class="profile-info">

                <h2>Website Developer</h2>

                <p>Dezyne Ecole College</p>

                <p>BCA 1st year</p>

                <!-- Social Media Icons -->
                <div class="social-icons">

                    <a href="#" aria-label="Facebook">
                        <i class="fa-brands fa-facebook"></i>
                    </a>

                    <a href="#" aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="#" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="#" aria-label="Behance">
                        <i class="fa-brands fa-behance"></i>
                    </a>

                </div>

                <!-- Profile Buttons -->
                <div class="profile-buttons">

                    <button>Subscribe</button>

                    <button>Manage</button>

                </div>

                <!-- Statistics -->
                <div class="stats">

                    <div class="stats-div">

                        <i class="fa-regular fa-heart"></i>
                        <span>69.1k</span>

                        <i class="fa-regular fa-comment"></i>
                        <span>20k</span>

                        <i class="fa-solid fa-share"></i>
                        <span>12k</span>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
