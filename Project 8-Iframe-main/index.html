<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-Frame</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0%;
            padding: 0%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1220;
            color: white;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            width: 100%;
            min-height: calc(100vh - 60px);
            display: flex;

        }

        .sidebar {
            width: 250px;
            padding: 35px 20px;
            border-right: 1px solid #26344d;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .sidebar a {
            width: 100%;
            padding: 14px 10px;
            text-align: center;
            text-decoration: none;
            color: white;
            background: #102a52;
            border: 1px solid black;
            font-size: 16px;
            transition: 0.2s;
            border-radius: 30px;

        }

        .sidebar a:hover {
            background: #163b79;
            border-color: #3d6eaa;
            transform: translateY(-2px);
        }

        .content {
            flex: 1;
            min-height: calc(100vh - 60px);
        }

        .content iframe {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 60px);
            border: none;
            background: white;
        }
    </style>

<style id="responsive-overrides">
/* Responsive overrides */
.container { display:flex; gap:0; min-width:0; }
.sidebar { flex:0 0 250px; min-width:0; }
.content { flex:1; min-width:0; }
.content iframe { display:block; width:100%; }
*, *::before, *::after { box-sizing: border-box; }
html { width: 100%; max-width: 100%; }
body { max-width: 100%; }
img, video, canvas, svg { max-width: 100%; height: auto; }
input, select, textarea, button { max-width: 100%; }
@media (max-width: 768px) {
  body { overflow-wrap: anywhere; }
  .container, .wrapper, .main-container, .page, main { max-width: 100%; }
  table { max-width: 100%; }
}
@media (max-width: 600px) {
  body { min-width: 0 !important; }
  h1 { font-size: clamp(1.6rem, 7vw, 2.5rem); }
  h2 { overflow-wrap: anywhere; }
  table { display: block; width: 100% !important; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  iframe { max-width: 100%; }
  form, .form, .login-box, .signup-box, .card { max-width: 100%; }
}
</style>

<style>
@media (max-width: 700px) {
 body { padding: 12px; }
 .container { min-height: calc(100vh - 24px); flex-direction: column; }
 .sidebar { width:100%; flex:0 0 auto; padding:12px 8px; border-right:0; border-bottom:1px solid #26344d; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
 .sidebar a { padding:11px 8px; font-size:14px; }
 .content { width:100%; min-height:65vh; }
 .content iframe { min-height:65vh; height:65vh; }
}
@media (max-width: 380px) { .sidebar { grid-template-columns:1fr 1fr; } }
</style>

</head>

<body>
    <div class="container">
        <div class="sidebar">
            <a href="Project 1 Background Image\Project_1.html" target="contentFrame">Project 1</a>
            <a href="Project_2.html" target="contentFrame">Project 2</a>

            <a href="Project_3.html" target="contentFrame">Project 3</a>

            <a href="Project 4 Dynamic Gallery\Project_4.html" target="contentFrame">Project 4</a>
            <a href="Project_5.html" target="contentFrame">Project 5</a>
            <a href="Project 6 Multi page navigation\Project_6.html" target="contentFrame">Project 6</a>
              <a href="Project_7.html" target="contentFrame">Project 7</a> 
               <a href="Project_9.html" target="contentFrame">Project 9</a>



        </div>
        <div class="content">
            <iframe name="contentFrame" src="Assignment 1.html" title=""></iframe>
        </div>
    </div>
</body>

</html>
