
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Profile Card</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        /* MAIN CONTAINER */

        .container {
            width: 100%;
            max-width: 1100px;
            min-height: 100vh;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(25px, 6vw, 80px);
        }

        /* LEFT SIDE */

        .box {
            display: flex;
            align-items: center;
            gap: 25px;
            flex: 1;
            min-width: 0;
        }

        .left-bar {
            width: 12px;
            min-width: 12px;
            height: 430px;
            background: rgb(2, 2, 83);
            border-radius: 20px;
        }

        .big-text {
            flex: 1;
        }

        .big-text h1 {
            font-size: clamp(42px, 7vw, 110px);
            font-family: Cambria, Cochin, Georgia,
                Times, 'Times New Roman', serif;

            line-height: 1.05;
            font-weight: 800;
            color: rgb(2, 2, 83);
        }

        /* PROFILE CARD */

        .profile-card {
            width: 320px;
            max-width: 100%;
            flex-shrink: 0;

            background-color: rgb(232, 237, 240);
            border-radius: 20px;
            overflow: hidden;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* COVER */

        .cover {
            height: 150px;
            background: linear-gradient(
                135deg,
                rgb(2, 2, 83),
                rgb(35, 60, 160)
            );

            position: relative;
        }

        /* PROFILE PICTURE */

        .profile-picture {
            width: 100px;
            height: 100px;
            border-radius: 50%;

            position: absolute;
            left: 50%;
            top: 70px;
            transform: translateX(-50%);

            border: 4px solid white;
            outline: 2px solid rgb(190, 200, 207);

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .profile-picture svg {
            width: 62px;
            height: 62px;
        }

        /* PROFILE INFO */

        .profile-info {
            text-align: center;
            padding: 40px 20px 25px;
        }

        .profile-info h2 {
            font-size: 23px;
            color: rgb(2, 2, 83);
            margin-bottom: 10px;
        }

        .profile-info p {
            color: #666;
            margin: 6px 0;
            font-size: 14px;
        }

        /* CONTACT DETAILS */

        .contact-info {
            margin-top: 15px;
        }

        .contact-info a {
            display: block;
            color: #333;
            font-size: 12px;
            text-decoration: none;
            margin: 10px 0;
            overflow-wrap: anywhere;
        }

        .contact-info a:hover {
            color: #0a66c2;
            text-decoration: underline;
        }

        .contact-info i {
            margin-right: 7px;
            color: rgb(2, 2, 83);
        }

        /* SOCIAL ICONS */

        .social-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 22px;
        }

        .social-icons a {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            font-size: 23px;
            text-decoration: none;

            background: white;

            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);

            transition: transform 0.3s, box-shadow 0.3s;
        }

        .social-icons a:hover {
            transform: translateY(-6px) scale(1.12);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
        }

        .fa-linkedin {
            color: #0a66c2;
        }

        .fa-github {
            color: #171515;
        }

        /* PROFILE BUTTONS */

        .profile-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        .profile-buttons a {
            padding: 10px 20px;
            border-radius: 50px;

            background: rgb(2, 2, 83);
            color: white;

            font-size: 13px;
            font-weight: bold;
            text-decoration: none;

            transition: 0.3s;
        }

        .profile-buttons a:hover {
            background: rgb(5, 5, 20);
            transform: scale(1.05);
        }

        /* STATS */

        .stats {
            border-top: 1px solid #ddd;
            padding: 18px 10px;

            display: flex;
            justify-content: space-around;
        }

        .stats > div {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 5px;

            color: #555;
            font-size: 13px;
        }

        .stats i {
            font-size: 17px;
            color: rgb(2, 2, 83);
        }

        /* TABLET RESPONSIVENESS */

        @media screen and (max-width: 900px) {

            .container {
                flex-direction: column;
                justify-content: center;
                gap: 35px;
                padding: 30px 0;
            }

            .box {
                width: 100%;
                justify-content: center;
                flex: none;
            }

            .left-bar {
                height: 230px;
            }

            .big-text h1 {
                font-size: clamp(45px, 9vw, 75px);
            }

            .profile-card {
                width: 340px;
            }

        }

        /* MOBILE RESPONSIVENESS */

        @media screen and (max-width: 480px) {

            body {
                padding: 15px;
            }

            .container {
                gap: 25px;
            }

            .box {
                gap: 12px;
            }

            .left-bar {
                width: 7px;
                min-width: 7px;
                height: 155px;
            }

            .big-text h1 {
                font-size: clamp(36px, 10vw, 50px);
            }

            .profile-card {
                width: 100%;
                max-width: 340px;
            }

            .cover {
                height: 135px;
            }

            .profile-picture {
                width: 95px;
                height: 95px;
                top: 65px;
            }

            .profile-info {
                padding: 38px 15px 22px;
            }

            .profile-info h2 {
                font-size: 21px;
            }

            .social-icons {
                gap: 13px;
            }

            .social-icons a {
                width: 42px;
                height: 42px;
                font-size: 21px;
            }

            .profile-buttons {
                gap: 10px;
            }

            .profile-buttons a {
                padding: 10px 16px;
                font-size: 12px;
            }

            .stats > div {
                font-size: 11px;
                gap: 3px;
            }

            .stats i {
                font-size: 14px;
            }

        }

        /* VERY SMALL SCREENS */

        @media screen and (max-width: 350px) {

            .big-text h1 {
                font-size: 34px;
            }

            .left-bar {
                height: 130px;
            }

            .profile-info {
                padding-left: 10px;
                padding-right: 10px;
            }

            .profile-buttons a {
                padding: 9px 12px;
            }

        }

    </style>

</head>
